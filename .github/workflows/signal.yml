# Regenerates the Signal panels (contribution skyline, snake, LeetCode) into the `output` branch.
name: signal
on:
  schedule: [{ cron: "17 */12 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#5EEAD4&color_dots=#15151F,#2A2350,#4B3F9E,#8B7CF6,#B9B1FF&color_dot_border=#07070B

      - name: Restore last good data
        run: curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/output/cache.json" -o prev-cache.json || true

      - name: Render Signal panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/signal.py --user "${{ github.repository_owner }}" --leetcode Kashyap_Nasit_2007 --out dist --prev prev-cache.json

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
